# Saves each suggestion issue into recommendations.md and recommendations.json,
# then thanks the author and closes the issue.
name: Save suggestion

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: suggestions
  cancel-in-progress: false

jobs:
  save:
    if: contains(github.event.issue.labels.*.name, 'recommendation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Issue text is untrusted, so it only ever reaches the script as environment
      # variables, never as part of a command line.
      - name: Append to the recommendations files
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_CREATED: ${{ github.event.issue.created_at }}
        run: python .github/scripts/save_suggestion.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recommendations.md recommendations.json
          git commit -m "Save suggestion #${{ github.event.issue.number }}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Thank and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --comment "Thanks! This is saved in recommendations.md for review."
