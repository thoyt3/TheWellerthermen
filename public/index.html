<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Activity Recommender</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
  <style>
    /* Basic styling for the map */
    #map {
      height: 400px;
      margin-top: 20px;
    }

    /* Additional styling for form */
    form {
      display: flex;
      flex-direction: column;
      max-width: 400px;
      margin-bottom: 20px;
    }

    label {
      margin-top: 10px;
    }

    input, select, button {
      padding: 8px;
      margin-top: 5px;
    }

    button {
      cursor: pointer;
    }

    #response-container {
      max-width: 800px;
      margin-top: 20px;
    }

    #response-container ul {
      list-style-type: disc;
      margin-left: 20px;
    }

    #response-container a {
      color: blue;
      text-decoration: underline;
    }

    /* Style for the activity image */
    #activity-image {
      max-width: 400px;
      height: auto;
      margin-top: 20px;
    }

    /* Layout adjustments */
    #main-container {
      display: flex;
      flex-wrap: wrap;
    }

    #form-container {
      flex: 1;
      min-width: 300px;
    }

    #image-container {
      flex: 1;
      min-width: 300px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Find the Best Spot for Your Activity</h1>
  <div id="main-container">
    <div id="form-container">
      <form id="query-form">
        <!-- Date selector input -->
        <label for="date-select">Select a date (Today or next 7 days):</label>
        <input type="date" id="date-select" required>
    
        <!-- Time selector input (optional) -->
        <label for="time-select">Select a time (optional):</label>
        <input type="time" id="time-select">
    
        <!-- Manual location input (optional) -->
        <label for="manual-location">Enter desired location (optional):</label>
        <input type="text" id="manual-location" placeholder="e.g., Boston, MA">
    
        <!-- Activity dropdown -->
        <label for="activity-select">Select an activity:</label>
        <select id="activity-select" required>
          <option value="">Select an activity</option>
          <option value="scuba_diving">Scuba Diving</option>
          <option value="golf">Golfing</option>
          <option value="surfing">Surfing</option>
          <option value="hiking">Hiking</option>
          <option value="pickleball">Pickleball</option>
        </select>
    
        <!-- Units dropdown -->
        <label for="units-select">Select units:</label>
        <select id="units-select">
          <option value="imperial" selected>Imperial</option>
          <option value="metric">Metric</option>
        </select>
        
        <!-- Distance dropdown -->
        <label for="distance-select">Select a distance range:</label>
        <select id="distance-select">
          <!-- Options will be populated by script.js based on units -->
        </select>
    
    
    
        <button type="submit" id="submit-button">Submit</button>
      </form>
    </div>
    <div id="image-container">
      <img id="activity-image" src="" alt="Activity Image">
    </div>
  </div>
  
  <div id="response-container"></div>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Scripts -->
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- Your script -->
  <script src="script.js"></script>
</body>
</html>
