<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Wellerthermen</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="banner">
    <img id="activity-image" src="images/default.jpg" alt="">
    <div id="banner-text">
      <h1>The Wellerthermen</h1>
      <p>Where and when to go, scored hour by hour from the forecast.</p>
    </div>
  </header>

  <main>
    <form id="query-form">
      <div class="field">
        <label for="activity-select">Activity</label>
        <select id="activity-select" required>
          <option value="golf">Golf</option>
          <option value="hiking">Hiking</option>
          <option value="scuba_diving">Scuba diving</option>
          <option value="surfing">Surfing</option>
        </select>
      </div>
      <div class="field grow">
        <label for="manual-location">Near</label>
        <div class="row">
          <input type="text" id="manual-location" placeholder="Boston, MA" autocomplete="off">
          <button type="button" id="locate-button" title="Use my current location">Locate me</button>
        </div>
      </div>
      <div class="field">
        <label for="date-select">Date</label>
        <input type="date" id="date-select" required>
      </div>
      <div class="field">
        <label for="time-select">Start time (optional)</label>
        <input type="time" id="time-select" step="3600">
      </div>
      <div class="field">
        <label for="max-distance">Within (<span id="distance-unit">mi</span>)</label>
        <input type="number" id="max-distance" min="1" max="500" value="30" step="1">
      </div>
      <div class="field">
        <label for="units-select">Units</label>
        <select id="units-select">
          <option value="imperial" selected>Imperial</option>
          <option value="metric">Metric</option>
        </select>
      </div>
      <div class="field grow">
        <label for="specific-location">Only this place (optional)</label>
        <input type="text" id="specific-location" list="location-names" placeholder="Start typing a name" autocomplete="off">
        <datalist id="location-names"></datalist>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button type="submit" id="submit-button">Find spots</button>
      </div>
    </form>

    <div id="status" role="status"></div>

    <div id="layout">
      <section id="results"></section>
      <div id="map"></div>
    </div>
  </main>

  <footer>
    Forecast data from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>,
    geocoding and map from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>.
    Scores are a rule of thumb, so check conditions yourself before you go.
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
